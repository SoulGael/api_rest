<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">Iniciar Sesión</h3>
    <div class="form-group mb-3">
      <label for="email">Correo</label>
      <input [(ngModel)]="email" type="email" id="email" class="form-control" placeholder="ejemplo@correo.com">
    </div>
    <div class="form-group mb-4">
      <label for="password">Contraseña</label>
      <input [(ngModel)]="password" type="password" id="password" class="form-control" placeholder="******">
    </div>
    <button (click)="login()" class="btn btn-primary w-100">Ingresar</button>
    <p class="text-danger text-center mt-3">{{ message }}</p>
  </div>
</div>
