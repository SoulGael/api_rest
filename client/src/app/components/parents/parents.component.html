<!-- ✅ UsersComponent - Tabla con paginación y acciones -->
<div class="container mt-4">
  <h3>Usuarios</h3>

  <!-- Tabla de usuarios -->
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Trabajo</th>
        <th>Nro Teléfono</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of parents">
        <td>{{ data.completeName }}</td>
        <td>{{ data.job }}</td>
        <td>{{ data.phoneNumber }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="editData(data)">Editar</button>
          <button class="btn btn-sm btn-danger" (click)="deleteData(data)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Paginación -->
  <nav *ngIf="totalPages > 1">
  <ul class="pagination justify-content-center">
    
    <!-- Botón Anterior -->
    <li class="page-item" [class.disabled]="currentPage === 1">
      <button class="page-link" (click)="changePage(currentPage - 1)" [disabled]="currentPage === 2">
        Anterior
      </button>
    </li>

    <!-- Botones numerados -->
    <li class="page-item" *ngFor="let i of pages">
      <button class="page-link" [class.active]="i === currentPage" (click)="changePage(i)">
        {{ i }}
      </button>
    </li>

    <!-- Botón Siguiente -->
    <li class="page-item" [class.disabled]="currentPage === totalPages">
      <button class="page-link" (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">
        Siguiente
      </button>
    </li>

  </ul>
</nav>

</div>
